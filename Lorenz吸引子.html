<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Lorenz 吸引子 · 蝴蝶效应</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#05070d; color:#cfe9ff;
               font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  canvas { display:block; }
  #ui { position:fixed; top:18px; left:18px; min-width:250px;
        background:rgba(8,16,28,.82); border:1px solid rgba(0,190,255,.22);
        border-radius:10px; padding:13px 15px; font-size:13px; line-height:1.9;
        backdrop-filter:blur(6px); }
  #ui h1 { margin:0 0 8px; font-size:14px; font-weight:600; color:#7fe3ff; }
  .row { display:flex; justify-content:space-between; gap:14px; }
  .k { color:#6b8ba8; } .v { font-variant-numeric:tabular-nums; color:#d7f2ff; }
  #btns { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  button { background:rgba(0,160,230,.12); border:1px solid rgba(0,190,255,.35);
           color:#9fe4ff; border-radius:6px; padding:5px 12px; font-size:12px; cursor:pointer; }
  button:hover { background:rgba(0,190,255,.22); }
  #legend { position:fixed; bottom:16px; left:18px; font-size:12px; color:#4d6f8a; }
  .dotA { color:#00d4ff; } .dotB { color:#ff3c8c; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Lorenz 吸引子</h1>
  <div class="row"><span class="k">参数</span><span class="v">σ=10 ρ=28 β=8/3</span></div>
  <div class="row"><span class="k">演化时间</span><span class="v" id="t">0.0</span></div>
  <div class="row"><span class="k">初始差距</span><span class="v">0.00001</span></div>
  <div class="row"><span class="k">当前差距</span><span class="v" id="d">0.00001</span></div>
  <div id="btns">
    <button id="bReset">重新开始</button>
    <button id="bRot">暂停旋转</button>
  </div>
</div>
<div id="legend">两条轨迹初始只差 0.00001 —— 它们会在蝴蝶上越走越远</div>

<script>
(function () {
  "use strict";
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1;

  var SIGMA = 10, RHO = 28, BETA = 8 / 3;
  var DT = 0.0035;
  var SUB = 6;

  var A, B, elapsed;
  var trailA, trailB;
  var MAXTRAIL = 4200;

  var rot = 0, rotOn = true;
  var cx = 0, cy = 0, scale = 3;

  function deriv(s) {
    var x = s[0], y = s[1], z = s[2];
    return [SIGMA * (y - x), x * (RHO - z) - y, x * y - BETA * z];
  }
  function stepRK(s, dt) {
    var k1 = deriv(s);
    var s2 = [s[0]+dt/2*k1[0], s[1]+dt/2*k1[1], s[2]+dt/2*k1[2]];
    var k2 = deriv(s2);
    var s3 = [s[0]+dt/2*k2[0], s[1]+dt/2*k2[1], s[2]+dt/2*k2[2]];
    var k3 = deriv(s3);
    var s4 = [s[0]+dt*k3[0], s[1]+dt*k3[1], s[2]+dt*k3[2]];
    var k4 = deriv(s4);
    return [
      s[0] + dt/6*(k1[0]+2*k2[0]+2*k3[0]+k4[0]),
      s[1] + dt/6*(k1[1]+2*k2[1]+2*k3[1]+k4[1]),
      s[2] + dt/6*(k1[2]+2*k2[2]+2*k3[2]+k4[2])
    ];
  }

  function reset() {
    A = [1, 1, 1];
    B = [1 + 0.00001, 1, 1];
    elapsed = 0;
    trailA = []; trailB = [];
    rot = 0;
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W * 0.5; cy = H * 0.52;
    scale = Math.min(W / 70, H / 75);
    reset();
  }

  function project(x, y, z) {
    var ca = Math.cos(rot), sa = Math.sin(rot);
    var X = x * ca - y * sa;
    var Y = x * sa + y * ca;
    var elev = 0.40;
    var sy = -(z * Math.cos(elev) - Y * Math.sin(elev));
    return [cx + X * scale, cy + sy * scale + scale * 25 * Math.cos(elev)];
  }

  function drawTrail(tr, color) {
    if (tr.length < 2) return;
    ctx.beginPath();
    var p = project(tr[0][0], tr[0][1], tr[0][2]);
    ctx.moveTo(p[0], p[1]);
    for (var i = 1; i < tr.length; i++) {
      p = project(tr[i][0], tr[i][1], tr[i][2]);
      ctx.lineTo(p[0], p[1]);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.1;
    ctx.stroke();
  }

  function frame(t) {
    requestAnimationFrame(frame);

    for (var i = 0; i < SUB; i++) {
      A = stepRK(A, DT);
      B = stepRK(B, DT);
      elapsed += DT;
      if (i % 2 === 0) {
        trailA.push(A); trailB.push(B);
      }
    }
    if (trailA.length > MAXTRAIL) { trailA.splice(0, trailA.length - MAXTRAIL); }
    if (trailB.length > MAXTRAIL) { trailB.splice(0, trailB.length - MAXTRAIL); }

    if (rotOn) rot += 0.0022;

    ctx.fillStyle = "#05070d";
    ctx.fillRect(0, 0, W, H);

    drawTrail(trailA, "rgba(0,212,255,.55)");
    drawTrail(trailB, "rgba(255,60,140,.55)");

    // 当前点
    var pa = project(A[0], A[1], A[2]);
    var pb = project(B[0], B[1], B[2]);
    ctx.beginPath(); ctx.arc(pa[0], pa[1], 4, 0, Math.PI * 2);
    ctx.fillStyle = "#00d4ff"; ctx.fill();
    ctx.beginPath(); ctx.arc(pb[0], pb[1], 4, 0, Math.PI * 2);
    ctx.fillStyle = "#ff3c8c"; ctx.fill();

    document.getElementById("t").textContent = elapsed.toFixed(1);
    var d = Math.hypot(A[0]-B[0], A[1]-B[1], A[2]-B[2]);
    document.getElementById("d").textContent =
      d >= 1000 ? d.toExponential(2) : d.toFixed(5);
  }

  document.getElementById("bReset").addEventListener("click", reset);
  document.getElementById("bRot").addEventListener("click", function () {
    rotOn = !rotOn;
    this.textContent = rotOn ? "暂停旋转" : "继续旋转";
  });

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
